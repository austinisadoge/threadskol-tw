<header><div class="wrap nav">

  <ul><li><a href="./">首頁</a></li><li><a href="./brand.html">我是品牌</a></li><li><a class="btn" href="./register.html">免費登記</a></li></ul>
</div></header>

<main class="wrap form" style="padding-block:48px 72px">
  <div class="eyebrow">Creator Registration</div>
  <h1>創作者免費登記</h1>
  <p class="lead">一分鐘填完。審核通過後你會進入品牌可見的名單，聯絡方式在有合作案且你同意後才會交出。</p>
  <div class="note">怎麼算「擴散力指數」：打開你的 Threads 主頁，最近 20 篇貼文左下角的瀏覽數加總後除以 20，就是你的指數。不用很準，審核時我們會一起對照。</div>

  <form name="creator" method="POST" action="./thanks.html" data-netlify="true" netlify-honeypot="website">
    <input type="hidden" name="form-name" value="creator">
    <p class="hidden" aria-hidden="true"><label>請勿填寫 <input name="website" tabindex="-1" autocomplete="off"></label></p>

    <fieldset><legend>基本資料</legend>
      <label>Threads 主頁連結 <input type="url" name="threads_url" required placeholder="https://www.threads.com/@your_id" pattern="https?://(www\.)?threads\.(com|net)/@.*"><span class="hint">請貼完整網址，開頭是 threads.com/@ 或 threads.net/@</span></label>
      <label>擴散力指數 <span class="opt">（近 20 篇平均瀏覽）</span><input type="number" name="avg_views" min="0" required placeholder="例：32000"></label>
    </fieldset>

    <fieldset><legend>內容領域（可複選）</legend>
      <div class="checks">
        <label><input type="checkbox" name="topics" value="美食餐飲">美食 / 餐飲</label>
        <label><input type="checkbox" name="topics" value="旅遊住宿">旅遊 / 住宿</label>
        <label><input type="checkbox" name="topics" value="AI科技">AI / 科技工具</label>
        <label><input type="checkbox" name="topics" value="職場成長">職場 / 自我成長</label>
        <label><input type="checkbox" name="topics" value="理財投資">理財 / 投資</label>
        <label><input type="checkbox" name="topics" value="親子育兒">親子 / 育兒</label>
        <label><input type="checkbox" name="topics" value="美妝穿搭">美妝 / 穿搭</label>
        <label><input type="checkbox" name="topics" value="健身健康">健身 / 健康</label>
        <label><input type="checkbox" name="topics" value="寵物">寵物</label>
        <label><input type="checkbox" name="topics" value="居家生活">居家 / 生活好物</label>
        <label><input type="checkbox" name="topics" value="教育語言">教育 / 語言</label>
        <label><input type="checkbox" name="topics" value="時事迷因">時事觀點 / 迷因</label>
      </div>
    </fieldset>

    <fieldset><legend>聯絡方式（不公開，只在有合作案時使用）</legend>
      <label>Email <input type="email" name="email" required placeholder="you@example.com"></label>
      <label>LINE 或 WhatsApp <input type="text" name="contact" required placeholder="LINE ID 或 WhatsApp 電話／帳號"></label>
    </fieldset>

    <label class="agree"><input type="checkbox" name="agree" value="yes" required><span>我確認以上資料屬實，同意 ThreadsKOL 在有合作案時把我的 Threads 連結、領域與擴散力指數提供給品牌，聯絡方式僅在我同意後交出。</span></label>
    <button class="btn big" type="submit">送出登記</button>
  </form>
</main>
